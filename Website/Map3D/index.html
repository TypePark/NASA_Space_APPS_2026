<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TIF Terrain</title>
  <style>html,body{margin:0;height:100%;background:#0b1220}</style>
  <script src="tif-terrain.js"></script>
</head>
<body>
  <!-- ?src=other.tif to load another DEM, ?rain=other.tif for another precipitation GeoTIFF (?rain=none: off) -->
  <!-- bounds = west,south,east,north (SW 34.41917,32.15293  NE 35.7758,34.73326) -->
  <tif-terrain id="map" style="height:100%" bounds="32.15293,34.41917,34.73326,35.7758"></tif-terrain>
  <script>
    const qs = new URLSearchParams(location.search);
    const map = document.getElementById('map');
    const rain = qs.get('rain') || '../GIOVANNI-g4.timeAvgMap.GPM_3IMERGM_07_precipitation.19980101-20260930.32E_34N_34E_35N.tif';
    if (rain !== 'none') map.setAttribute('rain', rain);   // before src: loads in parallel with the DEM
    map.setAttribute('src', qs.get('src') || '../output_hh.tif');
  </script>
</body>
</html>
